# Cloud Build config per il deploy continuo del BACKEND, agganciato al trigger
# GitHub (push su main). Build via Dockerfile (root), non Buildpacks: i
# trigger creati dalla Console con "Continuously deploy" usano Buildpacks di
# default, che non installano il driver ODBC richiesto dai tool sql.*/
# dataquality.*/mdm.* — per questo qui il Dockerfile è esplicito.
#
# GATE: se i test falliscono, questo step esce con codice diverso da 0 e
# Cloud Build interrompe la pipeline PRIMA di build/push/deploy — nessun
# commit che rompe i test arriva mai in produzione.
steps:
  - name: python:3.11-slim
    id: Test
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        pip install --no-cache-dir -e ".[dev]"
        python -m pytest -q
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/hemmy-backend:$COMMIT_SHA
      - -f
      - Dockerfile
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/hemmy-backend:$COMMIT_SHA
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - hemmy-backend
      - --platform=managed
      - --region=europe-west1
      - --image=europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/hemmy-backend:$COMMIT_SHA
      - --quiet

images:
  - europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/hemmy-backend:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
